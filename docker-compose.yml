services:
  neo4j:
    image: neo4j:5.26
    container_name: mirofish-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Neo4j Docker 镜像首次初始化只支持内置 neo4j 用户；密码从 .env 的 NEO4J_PASSWORD 读取。
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-password}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
      args:
        UV_HTTP_TIMEOUT: "${UV_HTTP_TIMEOUT:-300}"
    container_name: mirofish-backend
    depends_on:
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ZEP_BACKEND: graphiti
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5001
      FLASK_DEBUG: "False"
      SIMULATION_PYTHON: /app/backend/.venv-simulation/bin/python
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_logs:/app/backend/logs
    ports:
      - "5001:5001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      network: host
      args:
        VITE_API_BASE_URL: /api
        VITE_GIT_SHA: ${GIT_SHA:-unknown}
        VITE_BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: mirofish-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  backend_uploads:
  backend_logs:
